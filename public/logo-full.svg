<svg width="800" height="300" viewBox="0 0 800 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main circle with green gradient curve -->
  <path d="M60 150C60 110 75 75 100 50" stroke="#468B25" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M100 250C75 225 60 190 60 150" stroke="#2E7D32" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M140 280C115 270 95 255 80 235" stroke="#3D7F36" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Leaves on the left side -->
  <ellipse cx="75" cy="55" rx="14" ry="22" fill="#468B25" transform="rotate(-30 75 55)"/>
  <ellipse cx="92" cy="45" rx="12" ry="20" fill="#468B25" transform="rotate(-15 92 45)"/>
  <ellipse cx="108" cy="40" rx="13" ry="21" fill="#8BC34A" transform="rotate(0 108 40)"/>

  <!-- Sun at the top -->
  <circle cx="115" cy="65" r="28" fill="#FDC800"/>
  <!-- Sun rays -->
  <line x1="115" y1="37" x2="115" y2="22" stroke="#FDC800" stroke-width="6" stroke-linecap="round"/>
  <line x1="140" y1="50" x2="150" y2="40" stroke="#FDC800" stroke-width="6" stroke-linecap="round"/>
  <line x1="150" y1="75" x2="165" y2="75" stroke="#FDC800" stroke-width="6" stroke-linecap="round"/>
  <line x1="90" y1="50" x2="80" y2="40" stroke="#FDC800" stroke-width="6" stroke-linecap="round"/>

  <!-- Plate/bowl in center of circle -->
  <ellipse cx="110" cy="155" rx="42" ry="10" fill="#E0E0E0" opacity="0.3"/>
  <ellipse cx="110" cy="150" rx="38" ry="8" fill="white" stroke="#3D7F36" stroke-width="2.5"/>
  <ellipse cx="110" cy="148" rx="34" ry="6" fill="#F5F5F5"/>
  <ellipse cx="110" cy="146" rx="30" ry="5" fill="white"/>

  <!-- Small leaf at bottom right of circle -->
  <ellipse cx="150" cy="230" rx="11" ry="18" fill="#468B25" transform="rotate(40 150 230)"/>
  <ellipse cx="165" cy="215" rx="9" ry="15" fill="#8BC34A" transform="rotate(25 165 215)"/>

  <!-- Text: kids (Orange) -->
  <text x="220" y="185" font-family="Dana, sans-serif" font-size="110" font-weight="800" fill="#F2873B" letter-spacing="-2">kids</text>

  <!-- Text: Meals (Dark Green) -->
  <text x="485" y="185" font-family="Dana, sans-serif" font-size="110" font-weight="800" fill="#2E7D32" letter-spacing="-2">Meals</text>
</svg>
