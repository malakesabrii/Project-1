<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main circle with green gradient curves -->
  <path d="M40 100C40 70 52 45 72 30" stroke="#468B25" stroke-width="10" stroke-linecap="round"/>
  <path d="M72 170C52 155 40 130 40 100" stroke="#2E7D32" stroke-width="10" stroke-linecap="round"/>
  <path d="M105 185C85 180 68 170 55 155" stroke="#3D7F36" stroke-width="8" stroke-linecap="round"/>

  <!-- Leaves on the left -->
  <ellipse cx="58" cy="38" rx="11" ry="18" fill="#468B25" transform="rotate(-30 58 38)"/>
  <ellipse cx="72" cy="30" rx="9" ry="16" fill="#468B25" transform="rotate(-15 72 30)"/>
  <ellipse cx="86" cy="26" rx="10" ry="17" fill="#8BC34A"/>

  <!-- Sun at top -->
  <circle cx="90" cy="50" r="22" fill="#FDC800"/>
  <line x1="90" y1="28" x2="90" y2="18" stroke="#FDC800" stroke-width="5" stroke-linecap="round"/>
  <line x1="108" y1="37" x2="116" y2="29" stroke="#FDC800" stroke-width="5" stroke-linecap="round"/>
  <line x1="117" y1="55" x2="127" y2="55" stroke="#FDC800" stroke-width="5" stroke-linecap="round"/>
  <line x1="72" y1="37" x2="64" y2="29" stroke="#FDC800" stroke-width="5" stroke-linecap="round"/>

  <!-- Plate in center -->
  <ellipse cx="90" cy="105" rx="35" ry="8" fill="#E0E0E0" opacity="0.3"/>
  <ellipse cx="90" cy="100" rx="32" ry="6" fill="white" stroke="#3D7F36" stroke-width="2"/>
  <ellipse cx="90" cy="98" rx="28" ry="5" fill="#F5F5F5"/>
  <ellipse cx="90" cy="96" rx="24" ry="4" fill="white"/>

  <!-- Bottom right leaves -->
